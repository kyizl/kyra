name: Showcase Screenshot

on:
  workflow_dispatch:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - assets/showcase-pika.png
      - assets/showcase-jartex.png

permissions:
  contents: write

jobs:
  showcase:
    name: Capture and commit showcases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build renderer
        run: npm run build

      - name: Capture showcase screenshots
        run: npx playwright test showcase.spec.ts --reporter=line
        env:
          CI: true

      - name: Commit screenshots
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase-pika.png assets/showcase-jartex.png

          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "chore: update showcase screenshots [skip ci]"

          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort
              sleep $((attempt * 5))
              continue
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Failed to push showcase screenshots after retries."
          exit 1
