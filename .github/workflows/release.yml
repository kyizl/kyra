name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.release.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          npx semantic-release | tee output.txt

          if grep -q "Published release" output.txt; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

          TAG=$(git describe --tags --abbrev=0)
          echo "new_release_git_tag=$TAG" >> $GITHUB_OUTPUT

          VERSION="${TAG#v}"
          echo "new_release_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Notify Discord — semantic-release failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CI }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_CI secret not set, skipping" && exit 0

          PAYLOAD=$(jq -nc \
            --arg title "Release Pipeline — semantic-release Failed" \
            --arg desc "Version determination failed for **${REPO}**. No release was created." \
            --arg repo "https://github.com/${REPO}" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg sha "${SHA:0:7}" \
            --arg run_url "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: 15158332,
              fields: [
                {name:"Repository",   value:$repo,    inline:true},
                {name:"Branch",       value:$branch,  inline:true},
                {name:"Triggered By", value:$actor,   inline:true},
                {name:"Commit",       value:$sha,     inline:true},
                {name:"Workflow Run", value:$run_url, inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"

  build-windows:
    name: Build — Windows (x64)
    runs-on: windows-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Tauri prerequisites
        run: rustup show

      - name: Package Windows installer
        run: npm run tauri:build

      - name: Generate Electron updater compatibility metadata
        shell: bash
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          INSTALLER=$(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' | head -n 1)
          [ -n "$INSTALLER" ] || { echo "Tauri Windows installer not found"; exit 1; }
          INSTALLER_NAME=$(basename "$INSTALLER")
          SHA512=$(openssl dgst -sha512 -binary "$INSTALLER" | base64 -w 0)
          SIZE=$(stat -c '%s' "$INSTALLER")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > target/release/bundle/nsis/latest.yml <<EOF
          version: $VERSION
          files:
            - url: $INSTALLER_NAME
              sha512: $SHA512
              size: $SIZE
          path: $INSTALLER_NAME
          sha512: $SHA512
          releaseDate: $RELEASE_DATE
          EOF

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" target/release/bundle/nsis/*.exe --clobber
          gh release upload "$TAG" target/release/bundle/nsis/latest.yml --clobber

  build-macos:
    name: Build — macOS (universal)
    runs-on: macos-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install universal Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Package macOS DMG and application
        run: npm run tauri:build -- --target universal-apple-darwin --bundles dmg,app

      - name: Create macOS ZIP and Electron updater metadata
        shell: bash
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          APP=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -n 1)
          [ -n "$APP" ] || { echo "macOS application bundle not found"; exit 1; }
          ZIP="target/universal-apple-darwin/release/bundle/macos/Kyra.Overlay.${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ZIP_NAME=$(basename "$ZIP")
          SHA512=$(openssl dgst -sha512 -binary "$ZIP" | base64 -w 0)
          SIZE=$(stat -f '%z' "$ZIP")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > target/universal-apple-darwin/release/bundle/macos/latest-mac.yml <<EOF
          version: $VERSION
          files:
            - url: $ZIP_NAME
              sha512: $SHA512
              size: $SIZE
          path: $ZIP_NAME
          sha512: $SHA512
          releaseDate: $RELEASE_DATE
          EOF

      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
          gh release upload "$TAG" target/universal-apple-darwin/release/bundle/macos/*.zip --clobber
          gh release upload "$TAG" target/universal-apple-darwin/release/bundle/macos/latest-mac.yml --clobber

  build-linux:
    name: Build — Linux (AppImage)
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Package Linux AppImage
        run: npm run tauri:build -- --bundles appimage

      - name: Generate Electron updater compatibility metadata
        shell: bash
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)
          [ -n "$APPIMAGE" ] || { echo "Linux AppImage not found"; exit 1; }
          APPIMAGE_NAME=$(basename "$APPIMAGE")
          SHA512=$(openssl dgst -sha512 -binary "$APPIMAGE" | base64 -w 0)
          SIZE=$(stat -c '%s' "$APPIMAGE")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > target/release/bundle/appimage/latest-linux.yml <<EOF
          version: $VERSION
          files:
            - url: $APPIMAGE_NAME
              sha512: $SHA512
              size: $SIZE
          path: $APPIMAGE_NAME
          sha512: $SHA512
          releaseDate: $RELEASE_DATE
          EOF

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-release.outputs.new_release_git_tag }}
        run: |
          gh release upload "$TAG" target/release/bundle/appimage/*.AppImage --clobber
          gh release upload "$TAG" target/release/bundle/appimage/latest-linux.yml --clobber

  notify:
    name: Notify Discord — Release Summary
    runs-on: ubuntu-latest
    needs: [semantic-release, build-windows, build-macos, build-linux]
    if: always() && needs.semantic-release.outputs.new_release_published == 'true'

    steps:
      - name: Post to Discord
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
          TAG: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          WIN_RESULT: ${{ needs.build-windows.result }}
          MAC_RESULT: ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_RELEASES secret not set, skipping" && exit 0

          badge() {
            case "$1" in
              success)   echo "Pass"      ;;
              failure)   echo "Failed"    ;;
              cancelled) echo "Cancelled" ;;
              *)         echo "Skipped"   ;;
            esac
          }

          WIN_BADGE=$(badge "$WIN_RESULT")
          MAC_BADGE=$(badge "$MAC_RESULT")
          LINUX_BADGE=$(badge "$LINUX_RESULT")

          if [ "$WIN_RESULT" = "success" ] && [ "$MAC_RESULT" = "success" ] && [ "$LINUX_RESULT" = "success" ]; then
            COLOR=3066993
            LABEL="All Platforms Built Successfully"
          elif [ "$WIN_RESULT" = "failure" ] || [ "$MAC_RESULT" = "failure" ] || [ "$LINUX_RESULT" = "failure" ]; then
            COLOR=15158332
            LABEL="Build Completed with Failures"
          else
            COLOR=16776960
            LABEL="Build Completed"
          fi

          PAYLOAD=$(jq -nc \
            --arg title "Release ${TAG} — ${LABEL}" \
            --arg desc "${VERSION} has been published. https://github.com/${REPO}/releases/tag/${TAG}" \
            --argjson color "$COLOR" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg win "$WIN_BADGE" \
            --arg mac "$MAC_BADGE" \
            --arg linux "$LINUX_BADGE" \
            --arg logs "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name:"Version", value:$version, inline:true},
                {name:"Tag",     value:$tag,     inline:true},
                {name:"Windows", value:$win,     inline:true},
                {name:"macOS",   value:$mac,     inline:true},
                {name:"Linux",   value:$linux,   inline:true},
                {name:"Logs",    value:$logs,    inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"
