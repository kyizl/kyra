name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze — JavaScript / TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Perform CodeQL analysis
        id: codeql
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: /language:javascript-typescript

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_CODEQL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SCAN_RESULT: ${{ steps.codeql.outcome }}
        run: |
          [ -z "$WEBHOOK_URL" ] && echo "DISCORD_WEBHOOK_CODEQL secret not set, skipping" && exit 0

          if [ "$SCAN_RESULT" = "success" ]; then
            COLOR=327424
            STATUS="Completed Successfully"
          else
            COLOR=15158332
            STATUS="Failed"
          fi

          desc=$(printf "**Branch:** \`%s\`\n**Commit:** \`%s\`\n**Event:** %s" "$BRANCH" "${SHA:0:7}" "$EVENT")

          PAYLOAD=$(jq -nc \
            --arg title "CodeQL — ${STATUS}" \
            --arg desc "$desc" \
            --arg result "$SCAN_RESULT" \
            --arg alerts "https://github.com/${REPO}/security/code-scanning" \
            --arg logs "https://github.com/${REPO}/actions/runs/${RUN_ID}" \
            --arg footer "${WORKFLOW} | Run #${RUN_NUMBER}" \
            --argjson color "$COLOR" \
            '{embeds:[{
              title: $title,
              description: $desc,
              color: $color,
              fields: [
                {name:"Language",        value:"`javascript-typescript`", inline:true},
                {name:"Result",          value:$result,                  inline:true},
                {name:"Security Alerts", value:$alerts,                  inline:false},
                {name:"Logs",            value:$logs,                    inline:false}
              ],
              footer: {text: $footer}
            }]}')

          HTTP=$(curl -sS -o /dev/stderr -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Discord responded: HTTP $HTTP"
