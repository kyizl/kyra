version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      vue-ecosystem:
        patterns:
          - 'vue*'
          - 'pinia*'
          - '@vitejs/*'
          - 'vite*'
      typescript-tooling:
        patterns:
          - 'typescript*'
          - vue-tsc
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - typescript-eslint
          - '@vue/tsconfig'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
