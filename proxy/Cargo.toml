[package]
name = "kyra_proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.12"
flate2 = "1.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
kyra_proto_spike = { path = "../spike" }

[dev-dependencies]
tokio = { version = "1.53", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "test-util"] }
